[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-translation-product"
version = "0.1.0"
description = "Offline translation product API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.111,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.7,<3.0",
  "pandas>=2.2,<3.0",
  "openpyxl>=3.1,<4.0",
  "transformers>=4.44,<5.0",
  "ctranslate2>=4.4,<5.0",
  "sentencepiece>=0.2,<1.0",
  "huggingface-hub>=0.24,<1.0",
  "safetensors>=0.4,<1.0",
  "torch>=2.10.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.6.9,<1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
include = ["app*"]
namespaces = true

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["app", "preload_models"]

[tool.coverage.report]
show_missing = true
skip_covered = true
