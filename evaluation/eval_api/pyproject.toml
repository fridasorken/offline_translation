[project]
name = "translation-eval-api"
version = "0.1.0"
description = "Offline Translation Eval API"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.30",
  "transformers>=4.40",
  "datasets>=2.19",
  "accelerate>=0.30",
  "sentencepiece>=0.2",
  "torch>=2.2",
  "ctranslate2>=4.4",
  "sacrebleu>=2.4",
  "unbabel-comet>=2.2",
  "memory-profiler>=0.61",
  "psutil>=6.0",
  "setuptools>=68,<81",
  "sphinx>=7.0",
  "sphinx-rtd-theme>=2.0",
]

[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
