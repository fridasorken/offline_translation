name: Product Unit Tests

on:
  push:
    branches: [ chore/write-more-unit-tests ]

jobs:
  test-product:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: product

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run unit tests
        run: uv run pytest